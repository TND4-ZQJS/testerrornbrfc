<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amendment to Application Form Filler</title>
  
  <!-- pdf-lib & SignaturePad CDN -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  
  <style>
    :root {
      --primary-color: #008080;
      --primary-hover: #006666;
      --secondary-color: #2c3e50;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
      --text-color: #333333;
      --text-muted: #777777;
      --error-color: #e74c3c;
      --success-color: #2ecc71;
      --radius: 8px;
      --shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }

    .nav-brand { font-size: 1.25rem; font-weight: 700; color: var(--primary-color); }
    .nav-links { display: flex; gap: 1rem; align-items: center; }
    .nav-links a { text-decoration: none; color: var(--secondary-color); font-weight: 500; font-size: 0.9rem; }
    .nav-links a:hover { color: var(--primary-color); }

    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

    /* Wizard Tracker */
    .wizard-tracker {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2rem;
      position: relative;
    }
    .wizard-tracker::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border-color);
      z-index: 1;
      transform: translateY(-50%);
    }
    .step {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .step.active {
      border-color: var(--primary-color);
      background: var(--primary-color);
      color: white;
    }

    /* Cards & Steps */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .wizard-step { display: none; }
    .wizard-step.active { display: block; }

    h2 { margin-bottom: 1.5rem; color: var(--secondary-color); font-size: 1.25rem; border-bottom: 2px solid var(--bg-color); padding-bottom: 0.5rem; }

    /* Form Fields */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.25rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full-width { grid-column: 1 / -1; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--secondary-color); }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
    }
    textarea { resize: vertical; min-height: 120px; font-family: inherit; }

    .dropdown-with-button { display: flex; gap: 0.5rem; }
    .dropdown-with-button select { flex: 1; }

    /* Buttons */
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      background-color: var(--primary-color);
      color: white;
      transition: background 0.2s;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #e0e0e0; color: var(--secondary-color); }
    .btn-secondary:hover { background-color: #d0d0d0; }
    .btn-reset { background-color: var(--error-color); color: white; }
    .btn-reset:hover { background-color: #c0392b; }

    .wizard-nav { display: flex; justify-content: space-between; margin-top: 2rem; }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; }

    /* Signature UI */
    .sig-block {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
      background: #fafafa;
    }
    .sig-preview {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      border: 1px dashed #ccc;
      margin-bottom: 0.5rem;
      border-radius: 4px;
    }
    .sig-preview img { max-height: 100%; width: auto; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      padding: 1.5rem;
      border-radius: var(--radius);
      width: 90%;
      max-width: 500px;
    }
    canvas { width: 100%; height: 200px; border: 1px solid var(--border-color); border-radius: 4px; }

    /* Auto Save Status Indicator */
    #saveStatus {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-brand">Insurance Form Filler</div>
    <div class="nav-links" id="navMenu">
      <a href="#" id="backToMainLink">&larr; Back to Dashboard</a>
    </div>
  </header>

  <div class="container">
    
    <!-- Step Tracker -->
    <div class="wizard-tracker">
      <div class="step active" data-step="0">1</div>
      <div class="step" data-step="1">2</div>
      <div class="step" data-step="2">3</div>
    </div>

    <main>
      <!-- STEP 1: Basic Info -->
      <div class="wizard-step active">
        <div class="card">
          <h2>1. Policy & Insured Information</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="LifeProposed_Name">Life Proposed / Policy Owner Name</label>
              <input type="text" id="LifeProposed_Name" placeholder="JOHN DOE">
            </div>
            <div class="form-group">
              <label for="PolicyNo">Policy Number</label>
              <input type="text" id="PolicyNo" placeholder="P12345678">
            </div>
            <div class="form-group">
              <label for="LifeProposed_NRIC">NRIC / Passport No.</label>
              <input type="text" id="LifeProposed_NRIC" placeholder="880101012345">
            </div>
          </div>
        </div>
      </div>

      <!-- STEP 2: Amendments -->
      <div class="wizard-step">
        <div class="card">
          <h2>2. Amendment Details</h2>
          <div class="form-group full-width">
            <label for="Amendment_Common">Common Request Templates</label>
            <div class="dropdown-with-button">
              <select id="Amendment_Common">
                <option value="">-- Select Common Request --</option>
                <option value="CHANGE OF CORRESPONDENCE ADDRESS TO:">Change Address</option>
                <option value="CHANGE OF SERVICING AGENT TO:">Change Servicing Agent</option>
                <option value="REQUEST FOR DUPLICATE POLICY CONTRACT">Request Duplicate Contract</option>
              </select>
              <button class="btn insert" type="button">Insert</button>
            </div>
          </div>

          <div class="form-group full-width" style="margin-top: 1rem;">
            <label for="Amendment_WriteDetails">Write Amendment Details</label>
            <textarea id="Amendment_WriteDetails" placeholder="1. Type your amendment details here..."></textarea>
          </div>
        </div>
      </div>

      <!-- STEP 3: Signatures & Dates -->
      <div class="wizard-step">
        <div class="card">
          <h2>3. Declaration & Execution</h2>
          
          <div class="form-grid" style="margin-bottom: 1.5rem;">
            <div class="form-group">
              <label for="Signed_State">Signed Location / State</label>
              <input type="text" id="Signed_State" placeholder="KUALA LUMPUR">
            </div>
            <div class="form-group">
              <label>Signed Date</label>
              <div style="display: flex; gap: 0.5rem;">
                <select id="Signed_Day"><option value="">DD</option></select>
                <select id="Signed_Month"><option value="">MM</option></select>
                <select id="Signed_Year"><option value="">YYYY</option></select>
              </div>
            </div>
            <div class="form-group" style="justify-content: flex-end;">
              <button class="btn btn-secondary" type="button" onclick="setSignedDateToday()">Set Today's Date</button>
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="copyInfoCheckbox">
            <label for="copyInfoCheckbox" style="margin-bottom: 0;">Copy Life Proposed info to Signatory Details</label>
          </div>

          <div class="form-grid">
            <!-- Owner Sign Details -->
            <div class="form-group">
              <label for="Sign_LifeProposedPO_Name">Signatory Name</label>
              <input type="text" id="Sign_LifeProposedPO_Name">
              <label for="Sign_LifeProposedPO_NRIC" style="margin-top:0.5rem;">Signatory NRIC</label>
              <input type="text" id="Sign_LifeProposedPO_NRIC">
              <label for="Sign_LifeProposedPO_Mobile" style="margin-top:0.5rem;">Signatory Mobile</label>
              <input type="text" id="Sign_LifeProposedPO_Mobile">
            </div>

            <!-- Owner Signature Block -->
            <div class="sig-block" data-sig-role="owner" data-sig-title="Policy Owner Signature">
              <label>Policy Owner Signature</label>
              <div class="sig-preview" data-sig-preview><span>Tap to Sign (Owner)</span></div>
              <p id="APP_PO_Name_Display" style="font-weight: bold; font-size: 0.85rem; text-transform: uppercase;">-</p>
              <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size:0.75rem;" data-sig-clear type="button">Clear</button>
            </div>
          </div>

          <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border-color);">

          <div class="form-grid">
            <!-- Witness Details -->
            <div class="form-group">
              <label for="Sign_Witness_Name">Witness Name</label>
              <input type="text" id="Sign_Witness_Name">
              <label for="Sign_Witness_NRIC" style="margin-top:0.5rem;">Witness NRIC</label>
              <input type="text" id="Sign_Witness_NRIC">
            </div>

            <!-- Witness Signature Block -->
            <div class="sig-block" data-sig-role="witness" data-sig-title="Witness Signature">
              <label>Witness Signature</label>
              <div class="sig-preview" data-sig-preview><span>Tap to Sign (Witness)</span></div>
              <p id="APP_Witness_Name_Display" style="font-weight: bold; font-size: 0.85rem; text-transform: uppercase;">-</p>
              <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size:0.75rem;" data-sig-clear type="button">Clear</button>
            </div>
          </div>

          <div class="actions">
            <button class="btn" onclick="fillPDF('template.pdf', 'download')" type="button">Download Form PDF</button>
            <button class="btn btn-secondary" onclick="fillPDF('template.pdf', 'view')" type="button">Preview PDF</button>
            <button class="btn btn-reset" onclick="resetAllData()" type="button">Reset All Fields &amp; Signatures</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Navigation -->
    <div class="wizard-nav">
      <button class="btn btn-secondary" id="prevBtn" onclick="changeStep(-1)" type="button">Previous</button>
      <button class="btn" id="nextBtn" onclick="changeStep(1)" type="button">Next Step</button>
    </div>
  </div>

  <!-- Signature Modal -->
  <div class="modal" id="sigModal" aria-hidden="true">
    <div class="modal-content">
      <h3 id="sigModalTitle" style="margin-bottom: 1rem;">Signature Pad</h3>
      <canvas id="sigCanvas"></canvas>
      <div style="display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end;">
        <button class="btn btn-secondary" id="sigClear" type="button">Clear</button>
        <button class="btn btn-secondary" id="sigCancel" type="button">Cancel</button>
        <button class="btn" id="sigDone" type="button">Save</button>
      </div>
    </div>
  </div>

  <div id="saveStatus">Saved</div>

  <script>
    const FORM_ID = "APP";
    const $ = (id) => document.getElementById(id);

    /* Populate Date Select Options */
    (function populateDateDropdowns() {
      const daySel = $("Signed_Day");
      const monthSel = $("Signed_Month");
      const yearSel = $("Signed_Year");

      if (daySel && monthSel && yearSel) {
        for (let i = 1; i <= 31; i++) {
          const val = String(i).padStart(2, '0');
          daySel.add(new Option(val, val));
        }
        const months = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        months.forEach(m => monthSel.add(new Option(m, m)));

        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 1; y <= currentYear + 2; y++) {
          yearSel.add(new Option(String(y), String(y)));
        }
      }
    })();

    /* Local Storage Helper Functions */
    function saveElValue(el) {
      if (!el || !el.id) return;
      if (el.type === "checkbox" || el.type === "radio") {
        localStorage.setItem(el.id, el.checked);
      } else {
        localStorage.setItem(el.id, el.value);
      }
      showSaveStatus();
    }

    function showSaveStatus() {
      const saveStatus = $("saveStatus");
      if (saveStatus) {
        saveStatus.style.opacity = '1';
        setTimeout(() => { saveStatus.style.opacity = '0'; }, 1000);
      }
    }

    function autoBindSave(el) {
      if (!el || !el.id) return;

      const saved = localStorage.getItem(el.id);
      if (saved !== null) {
        if (el.type === "checkbox" || el.type === "radio") {
          el.checked = (saved === "true");
        } else {
          el.value = saved;
        }
      }

      if (el.tagName === "SELECT") {  
        el.addEventListener("change", () => saveElValue(el));
      } else if (el.type === "checkbox" || el.type === "radio") {  
        el.addEventListener("change", () => saveElValue(el));
      } else { 
        el.addEventListener("input", () => {
          const start = el.selectionStart;
          const end = el.selectionEnd;

          el.value = el.value.toUpperCase();

          if (start !== null && end !== null) {
            el.setSelectionRange(start, end); 
          }
          saveElValue(el);
        });
      }
    }
      
    /* ---------- UNIVERSAL FIELD PROCESSING ENGINE ---------- */
    function safeSetText(form, fieldName, value) {
      if (value === null || value === undefined) return;

      try {
        let field;

        try {
          field = form.getTextField(fieldName);
          field.setText(value.toUpperCase());
          return;
        } catch (e) {}

        try {
          field = form.getDropdown(fieldName);
          field.select(value);
          return;
        } catch (e) {}

        try {
          field = form.getCheckBox(fieldName);
          if (value === true || value === "true" || value === "on" || value === "checked") {
            field.check();
          } else {
            field.uncheck();
          }
          return;
        } catch (e) {}

        try {
          field = form.getRadioGroup(fieldName);
          field.select(value);
          return;
        } catch (e) {}

        console.warn(`Field ${fieldName} not found in PDF template structured design maps.`);
      } catch (err) {
        console.error(`Error setting field map targets: ${fieldName}`, err);
      }
    }

    // WhatsApp-style text area line interception behaviors
    const writeDetailsTextArea = document.getElementById("Amendment_WriteDetails");
    if (writeDetailsTextArea) {
      writeDetailsTextArea.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          const start = this.selectionStart;
          const text = this.value.substring(0, start);
          const lastLine = text.split("\n").pop();

          const match = lastLine.match(/^(\d+)\.\s/);
          if (match) {
            const nextNum = parseInt(match[1]) + 1;
            this.setRangeText("\n" + nextNum + ". ", start, start, "end");
            this.dispatchEvent(new Event("input"));
            return;
          }

          if (/^-\s/.test(lastLine)) {
            this.setRangeText("\n- ", start, start, "end");
            this.dispatchEvent(new Event("input"));
            return;
          }

          this.setRangeText("\n", start, start, "end");
          this.dispatchEvent(new Event("input"));
        }
      });

      writeDetailsTextArea.addEventListener("input", function() {
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.toUpperCase();
        if (start !== null && end !== null) {
          this.setSelectionRange(start, end);
        }
        localStorage.setItem("Amendment_WriteDetails", this.value);
        showSaveStatus();
      });
    }

    // Dropdown quick select insertion logic
    const insertBtn = document.querySelector(".dropdown-with-button button.insert");
    const dropdown = document.getElementById("Amendment_Common");

    if (insertBtn && dropdown && writeDetailsTextArea) {
      insertBtn.addEventListener("click", () => {
        const val = dropdown.value;
        if (!val) return;

        if (writeDetailsTextArea.value.trim() === "") {
          writeDetailsTextArea.value = "1. " + val;
        } else {
          const lines = writeDetailsTextArea.value.split("\n");
          let lastNum = 0;
          lines.forEach(line => {
            const m = line.match(/^(\d+)\./);
            if (m) lastNum = Math.max(lastNum, parseInt(m[1]));
          });
          writeDetailsTextArea.value += `\n${lastNum + 1}. ${val}`;
        }

        writeDetailsTextArea.dispatchEvent(new Event("input"));
        dropdown.value = "";
      });
    }

    // Proportional Insured Data Copy Link Sync
    const checkbox = document.getElementById('copyInfoCheckbox');
    const sourceName = document.getElementById('LifeProposed_Name');
    const sourceNRIC = document.getElementById('LifeProposed_NRIC');
    const targetName = document.getElementById('Sign_LifeProposedPO_Name');
    const targetNRIC = document.getElementById('Sign_LifeProposedPO_NRIC');

    function syncData() {
      if (!checkbox) return;
      const isChecked = checkbox.checked;

      if (targetName && targetNRIC) {
        targetName.readOnly = isChecked;
        targetNRIC.readOnly = isChecked;

        if (isChecked && sourceName && sourceNRIC) {
          targetName.value = sourceName.value;
          targetNRIC.value = sourceNRIC.value;

          targetName.dispatchEvent(new Event('input', { bubbles: true }));
          targetNRIC.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }
    }

    if (checkbox) {
      checkbox.addEventListener('change', syncData);
    }

    [sourceName, sourceNRIC].forEach(input => {
      if (input) {
        input.addEventListener('input', () => {
          if (checkbox && checkbox.checked) syncData();
        });
      }
    });

    /* ---------- Signature Names Display ---------- */
    document.addEventListener("DOMContentLoaded", () => {
      // Auto bind local storage save to input controls
      document.querySelectorAll("input, select, textarea").forEach(autoBindSave);

      const fieldMap = {
        "Sign_LifeProposedPO_Name": "APP_PO_Name_Display",
        "Sign_Witness_Name": "APP_Witness_Name_Display"
      };

      function updateDisplay(storageKey, displayId, directValue = null) {
        const displayEl = document.getElementById(displayId);
        if (!displayEl) return;

        const sourceInput = document.getElementById(storageKey);
        
        const savedInStorage = localStorage.getItem(storageKey);
        const inputVal = sourceInput ? sourceInput.value : "";
        
        const value = (directValue !== null) 
          ? directValue 
          : (savedInStorage || inputVal);

        displayEl.textContent = value ? value.toUpperCase() : "-";
      }

      function refreshAllDisplays() {
        Object.entries(fieldMap).forEach(([storageKey, displayId]) => {
          updateDisplay(storageKey, displayId);
        });
      }

      Object.entries(fieldMap).forEach(([storageKey, displayId]) => {
        const sourceInput = document.getElementById(storageKey);
        if (sourceInput) {
          sourceInput.addEventListener("input", (e) => {
            updateDisplay(storageKey, displayId, e.target.value);
          });
          sourceInput.addEventListener("change", () => {
            updateDisplay(storageKey, displayId);
          });
        }
      });

      refreshAllDisplays();
      setTimeout(refreshAllDisplays, 100);

      initSignatureFields();
    });

    /* ---------- Date Set Today Button ---------- */  
    function setSignedDateToday() {
      const now = new Date();

      const dayStr = String(now.getDate()).padStart(2, '0');
      const monthNames = [
        "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
        "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
      ];
      const monthStr = monthNames[now.getMonth()];
      const yearStr = String(now.getFullYear());

      const daySelect = document.getElementById('Signed_Day');
      const monthSelect = document.getElementById('Signed_Month');
      const yearSelect = document.getElementById('Signed_Year');

      if (daySelect && monthSelect && yearSelect) {
        daySelect.value = dayStr;
        monthSelect.value = monthStr;
        yearSelect.value = yearStr;

        daySelect.dispatchEvent(new Event('change', { bubbles: true }));
        monthSelect.dispatchEvent(new Event('change', { bubbles: true }));
        yearSelect.dispatchEvent(new Event('change', { bubbles: true }));

        saveToLocalStorage('Signed_Day', dayStr);
        saveToLocalStorage('Signed_Month', monthStr);
        saveToLocalStorage('Signed_Year', yearStr);
      }
    }

    function saveToLocalStorage(id, value) {
      try {
        localStorage.setItem(id, value);
        showSaveStatus();
      } catch (e) {
        console.error('Failed to save to localStorage:', e);
      }
    }

    /* ---------- Signature Engine ---------- */
    let sigTarget = null;
    const sigModal = $("sigModal");
    const sigCanvas = $("sigCanvas");
    const sigCtx = sigCanvas.getContext("2d");

    const signaturePad = new SignaturePad(sigCanvas, {
      minWidth: 0.7,
      maxWidth: 2.5,
      penColor: "black",
      backgroundColor: "rgba(0,0,0,0)"
    });

    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      const storageKey = sigTarget ? `sig_${FORM_ID}_${sigTarget}` : null;
      const savedFromStorage = storageKey ? localStorage.getItem(storageKey) : null;

      sigCanvas.width = sigCanvas.offsetWidth * ratio;
      sigCanvas.height = sigCanvas.offsetHeight * ratio;
      sigCtx.setTransform(ratio, 0, 0, ratio, 0, 0);

      signaturePad.clear();

      if (savedFromStorage) {
        const img = new Image();
        img.onload = () => sigCtx.drawImage(img, 0, 0, sigCanvas.offsetWidth, sigCanvas.offsetHeight);
        img.src = savedFromStorage;
      }
    }

    function openSig({ role, title }) {
      sigTarget = role;
      if ($("sigModalTitle")) $("sigModalTitle").textContent = title || `Sign: ${role}`;
      sigModal.style.display = "flex";
      sigModal.setAttribute("aria-hidden", "false");
      requestAnimationFrame(resizeCanvas);
    }

    function closeSigModal() {
      sigModal.style.display = "none";
      sigModal.setAttribute("aria-hidden", "true");
      sigTarget = null;
    }

    $("sigDone")?.addEventListener("click", () => {
      if (!sigTarget || signaturePad.isEmpty()) return;

      const dataURL = sigCanvas.toDataURL("image/png");
      localStorage.setItem(`sig_${FORM_ID}_${sigTarget}`, dataURL);
      
      const block = document.querySelector(`[data-sig-role="${sigTarget}"]`);
      const previewDiv = block?.querySelector("[data-sig-preview]");
      if (previewDiv) {
        previewDiv.innerHTML = `<img src="${dataURL}" style="max-height:100%; width:auto;" alt="Signature ${sigTarget}">`;
      }
      closeSigModal();
    });

    $("sigClear")?.addEventListener("click", () => signaturePad.clear());
    $("sigCancel")?.addEventListener("click", closeSigModal);
    window.addEventListener("resize", resizeCanvas);

    function initSignatureFields() {
      document.querySelectorAll("[data-sig-role]").forEach((block) => {
        const role = block.dataset.sigRole;
        const title = block.dataset.sigTitle || `Sign: ${role}`;
        const previewEl = block.querySelector("[data-sig-preview]");
        const clearBtn = block.querySelector("[data-sig-clear]");
        const defaultText = `<span>Tap to Sign (${role.charAt(0).toUpperCase() + role.slice(1)})</span>`;

        previewEl?.addEventListener("click", () => openSig({ role, title }));

        clearBtn?.addEventListener("click", () => {
          localStorage.removeItem(`sig_${FORM_ID}_${role}`);
          if (previewEl) previewEl.innerHTML = defaultText;
        });

        const saved = localStorage.getItem(`sig_${FORM_ID}_${role}`);
        if (saved && previewEl) {
          previewEl.innerHTML = `<img src="${saved}" style="max-height:100%; width:auto;" alt="Signature ${role}">`;
        }
      });
    }

    async function embedSignatureToPdf(pdfDoc, pageIndex, options) {
      const { role, x, y, factor = 0.35 } = options;

      const formId = typeof FORM_ID !== "undefined" ? FORM_ID : "APP";
      const primaryKey = `sig_${formId}_${role}`;
      
      let sigDataUri = localStorage.getItem(primaryKey) 
                    || localStorage.getItem(`sig_${role}`) 
                    || localStorage.getItem(role);

      if (!sigDataUri || !sigDataUri.startsWith("data:image/png")) {
        console.warn(`No valid PNG signature found for role: ${role} (key tried: ${primaryKey})`);
        return;
      }

      try {
        const img = await pdfDoc.embedPng(sigDataUri);
        const originalSize = img.size();

        const baseWidth = 250;
        const aspectRatio = originalSize.width / originalSize.height;
        const renderWidth = baseWidth * factor;
        const renderHeight = (baseWidth / aspectRatio) * factor;

        const pages = pdfDoc.getPages();
        const targetPage = pages[pageIndex];

        if (targetPage) {
          targetPage.drawImage(img, {
            x: x,
            y: y,
            width: renderWidth,
            height: renderHeight
          });
        } else {
          console.error(`Page index ${pageIndex} does not exist in the PDF template.`);
        }
      } catch (err) {
        console.error(`Error embedding signature for role ${role}:`, err);
      }
    }
          
    /* ---------- Generate PDF ---------- */
    async function fillPDF(templateFileName, action = 'download') {
      const actionButtons = document.querySelectorAll('.actions button');
      actionButtons.forEach(btn => btn.disabled = true);

      const getValue = (id) => {
        const el = document.getElementById(id);
        return el ? el.value : "";
      };

      try {
        const response = await fetch(templateFileName);
        if (!response.ok) {
          throw new Error(`Failed to load template file: ${templateFileName}`);
        }
        const existingPdfBytes = await response.arrayBuffer();

        const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
        const form = pdfDoc.getForm();

        const amendmentField = form.getTextField("Amendment_WriteDetails");
        if (amendmentField) {
          amendmentField.enableMultiline(); 
          const val = localStorage.getItem("Amendment_WriteDetails") || "";
          amendmentField.setText(val.toUpperCase());
          amendmentField.setFontSize(9);
        }

        safeSetText(form, "LifeProposed_Name", getValue("LifeProposed_Name"));
        safeSetText(form, "PolicyNo", getValue("PolicyNo"));
        safeSetText(form, "LifeProposed_NRIC", getValue("LifeProposed_NRIC"));
        safeSetText(form, "Signed_State", getValue("Signed_State"));
        safeSetText(form, "Signed_Day", getValue("Signed_Day"));
        safeSetText(form, "Signed_Month", getValue("Signed_Month"));
        safeSetText(form, "Signed_Year", getValue("Signed_Year"));
        safeSetText(form, "Sign_LifeProposedPO_Name", getValue("Sign_LifeProposedPO_Name"));
        safeSetText(form, "Sign_LifeProposedPO_NRIC", getValue("Sign_LifeProposedPO_NRIC"));
        safeSetText(form, "Sign_LifeProposedPO_Mobile", getValue("Sign_LifeProposedPO_Mobile"));
        safeSetText(form, "Sign_Witness_Name", getValue("Sign_Witness_Name"));
        safeSetText(form, "Sign_Witness_NRIC", getValue("Sign_Witness_NRIC"));

        const targetPageIndex = 0;

        await embedSignatureToPdf(pdfDoc, targetPageIndex, { role: "owner",   x: 380,  y: 145, factor: 0.35 });
        await embedSignatureToPdf(pdfDoc, targetPageIndex, { role: "witness", x: 50, y: 145, factor: 0.35 });

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);

        const policyVal = getValue("PolicyNo");
        let policyNum = "NEW";

        if (policyVal.trim() !== "") {
          policyNum = policyVal.trim().replace(/[^a-z0-9]/gi, '_');
        } else {
          const savedPolicy = localStorage.getItem("PolicyNo");
          if (savedPolicy && savedPolicy.trim() !== "") {
            policyNum = savedPolicy.trim().replace(/[^a-z0-9]/gi, '_');
          }
        }

        const finalFileName = `${policyNum}_Amendment_to_Application.pdf`;

        if (action === 'view') {
          window.open(url, '_blank');
        } else {
          const link = document.createElement("a");
          link.href = url;
          link.download = finalFileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
        }

        setTimeout(() => URL.revokeObjectURL(url), 5000);

      } catch (err) {
        console.error("Critical PDF Error:", err);
        alert("PDF generation failed: " + (err.message || err));
      } finally {
        actionButtons.forEach(btn => btn.disabled = false);
      }
    }

    /* ---------- SYSTEM WORKSPACE SECURITY & TARGETED RESETS ---------- */
    window.resetFormAndReload = function() {
      if (!confirm("Are you sure you want to reset the form? All saved fields and signature snapshots will be erased permanently.")) {
        return; 
      }

      const formKeys = [
        "LifeProposed_Name", 
        "PolicyNo", 
        "ILWD_Trf_PolicyNo", 
        "LifeProposed_NRIC", 
        "Amendment_WriteDetails",
        "Signed_State", 
        "Signed_Day", 
        "Signed_Month", 
        "Signed_Year",
        "Sign_LifeProposedPO_Name", 
        "Sign_LifeProposedPO_NRIC", 
        "Sign_LifeProposedPO_Mobile",
        "Sign_Witness_Name", 
        "Sign_Witness_NRIC", 
        "copyInfoCheckbox",
        "wizardCurrentStep"
      ];

      formKeys.forEach(key => localStorage.removeItem(key));

      Object.keys(localStorage).forEach(key => {
        if (key.startsWith("sig_")) {
          localStorage.removeItem(key);
        }
      });

      window.location.reload();
    };

    // Alias for button in HTML
    window.resetAllData = window.resetFormAndReload;

    /* ---------- WIZARD TRACKER LOGIC ---------- */
    const steps = document.querySelectorAll(".wizard-step");
    const indicatorSteps = document.querySelectorAll(".step");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");

    const savedStep = parseInt(localStorage.getItem("wizardCurrentStep"), 10);
    let currentStep = (!isNaN(savedStep) && savedStep >= 0 && savedStep < steps.length) ? savedStep : 0;

    indicatorSteps.forEach((stepCircle, index) => {
      stepCircle.addEventListener("click", () => {
        navigateTo(index);
      });
    });

    function navigateTo(index) {
      steps.forEach(step => step.classList.remove("active"));
      indicatorSteps.forEach(ind => ind.classList.remove("active"));

      currentStep = index;
      localStorage.setItem("wizardCurrentStep", currentStep);

      steps[currentStep].classList.add("active");
      indicatorSteps[currentStep].classList.add("active");

      if (prevBtn) prevBtn.style.visibility = (currentStep === 0) ? "hidden" : "visible";

      if (nextBtn) {
        if (currentStep === steps.length - 1) {
          nextBtn.style.display = "none";
        } else {
          nextBtn.style.display = "block";
          nextBtn.innerText = "Next Step";
        }
      }

      const mainContent = document.querySelector('main');
      if (mainContent) mainContent.scrollIntoView({ behavior: 'smooth' });
    }

    function changeStep(n) {
      let newStep = currentStep + n;
      if (newStep >= 0 && newStep < steps.length) {
        navigateTo(newStep);
      }
    }
    window.changeStep = changeStep;

    document.addEventListener("DOMContentLoaded", () => {
      navigateTo(currentStep);
    });

    /* ---------- iOS-Style Back Navigation Interceptor ---------- */
    const backToMainLink = document.getElementById("backToMainLink");
    if (backToMainLink) {
      backToMainLink.addEventListener("click", function(e) {
        e.preventDefault();
        if (document.referrer && document.referrer.includes(window.location.hostname)) {
          window.history.back();
        } else {
          window.location.href = "dashboard.html";
        }
      });
    }  

    function toggleMobileMenu() {
      const nav = document.getElementById('navMenu');
      if (nav) nav.classList.toggle('show');
    }
  </script>
